spring.datasource.jndi-name=java:/personalfinancesDS
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Add timezone to the logs
logging.pattern.dateformat=yyyy-MM-dd HH:mm:ss

server.servlet.context-path=/personalfinances

spring.mvc.format.date=dd/MM/yyyy
spring.mvc.format.date-time=dd/MM/yyyy HH:mm:ss
spring.mvc.format.time=HH:mm:ss

spring.jackson.serialization.write-dates-as-timestamps=false

app.version=@project.version@

# Gemini AI configuration
# app.ai.gemini.api-keys se resuelve via system property (standalone.xml). Varias keys separadas por coma para rotación.
app.ai.gemini.model=gemini-3-flash-preview
app.ai.gemini.url=https://generativelanguage.googleapis.com/v1beta/models
