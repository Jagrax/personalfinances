<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://ultraq.net.nz/thymeleaf/layout"
      lang="es"
      layout:decorate="~{fragments/layout}">
<head>
    <title layout:fragment="page-title">Personal Finances App - Movimientos</title>
</head>
<body>
<div class="container-fluid p-4 overflow-y-auto" layout:fragment="content">
    <form id="expenseSearchForm" th:action="@{${'/expenses' + urlParams}}" th:object="${expenseSearch}" method="post"
          th:with="urlParams=${#strings.isEmpty(httpServletRequest.queryString) ? '' : '?' + httpServletRequest.queryString},backUrl=${'/expenses' + urlParams}">
        <input type="hidden" id="page" name="page" th:value="${currentPage}">

        <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
            <th:block th:each="chip : ${filterChips}">
                <div class="badge rounded-pill" style="--bs-badge-font-size:.875rem"
                     th:classappend="${chip.field == 'accountId' and accounts.size() == 1} ? 'bg-secondary' : 'bg-primary'">
                    <span th:text="|${chip.label} ${chip.operator.symbol} ${chip.value}|"></span>
                    <!-- Replico el comportamiento del select de cuentas, si vino solo 1, no puedo sacar este filtro -->
                    <a href="#" th:if="${!(chip.field == 'accountId' and accounts.size() == 1)}"
                       th:attr="data-field=${chip.field}" onclick="clearFilter(this)" class="text-white ms-1">
                        <i class="bi bi-x-lg ms-1"></i>
                    </a>
                    <i class="bi bi-lock-fill ms-1" th:if="${chip.field == 'accountId' and accounts.size() == 1}"></i>
                </div>
            </th:block>

            <a th:if="${expenseSearch.hasFilters()}" th:href="@{/expenses}" class="btn btn-sm btn-outline-danger ms-2"><i class="bi bi-x-circle me-1"></i>Limpiar</a>

            <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-toggle="collapse" data-bs-target="#filtersPanel"><i class="bi bi-filter me-2"></i>Filtros</button>
        </div>
        <div id="filtersPanel" class="collapse">
            <div class="row g-3">
                <div class="col-12 col-lg-4 col-xxl-2">
                    <div class="form-floating">
                        <input type="date" class="form-control" id="expenseFilterDate" name="date" th:value="${#temporals.format(expenseSearch.getDate(), 'yyyy-MM-dd')}" placeholder="Fecha">
                        <label for="expenseFilterDate">Fecha</label>
                    </div>
                </div>
                <div class="col-12 col-lg-4 col-xxl-2">
                    <div class="form-floating">
                        <input type="date" class="form-control" id="expenseFilterDateFrom" name="dateFrom" th:value="${#temporals.format(expenseSearch.getDateFrom(), 'yyyy-MM-dd')}" placeholder="Fecha desde">
                        <label for="expenseFilterDateFrom">Fecha desde</label>
                    </div>
                </div>
                <div class="col-12 col-lg-4 col-xxl-2">
                    <div class="form-floating">
                        <input type="date" class="form-control" id="expenseFilterDateTo" name="dateTo" th:value="${#temporals.format(expenseSearch.getDateTo(), 'yyyy-MM-dd')}" placeholder="Fecha hasta">
                        <label for="expenseFilterDateTo">Fecha hasta</label>
                    </div>
                </div>
                <div class="col-12 col-lg-4 col-xxl-2">
                    <div class="form-floating">
                        <input type="number" step=".01" class="form-control" id="expenseFilterAmount" name="amount" th:value="${expenseSearch.getAmount()}" placeholder="Importe">
                        <label for="expenseFilterAmount">Importe</label>
                    </div>
                </div>
                <div class="col-12 col-lg-4 col-xxl-2">
                    <div class="form-floating">
                        <input type="number" step=".01" class="form-control" id="expenseFilterAmountFrom" name="amountFrom" th:value="${expenseSearch.getAmountFrom()}" placeholder="Importe desde">
                        <label for="expenseFilterAmountFrom">Importe desde</label>
                    </div>
                </div>
                <div class="col-12 col-lg-4 col-xxl-2">
                    <div class="form-floating">
                        <input type="number" step=".01" class="form-control" id="expenseFilterAmountTo" name="amountTo" th:value="${expenseSearch.getAmountTo()}" placeholder="Importe hasta">
                        <label for="expenseFilterAmountTo">Importe hasta</label>
                    </div>
                </div>
                <div class="col-12 col-lg-4 col-xxl-2">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="expenseFilterDescription" name="description" th:value="${expenseSearch.getDescription()}" placeholder="Descripci&oacute;n">
                        <label for="expenseFilterDescription">Descripci&oacute;n</label>
                    </div>
                </div>
                <div class="col-12 col-lg-4 col-xxl-2">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="expenseFilterDetails" name="details" th:value="${expenseSearch.getDetails()}" placeholder="Detalle">
                        <label for="expenseFilterDetails">Detalle</label>
                    </div>
                </div>
                <div class="col-12 col-lg-4 col-xxl-2">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="expenseFilterComments" name="comments" th:value="${expenseSearch.getComments()}" placeholder="Comentario">
                        <label for="expenseFilterComments">Comentario</label>
                    </div>
                </div>
                <div class="col-12 col-lg-4 col-xxl-2">
                    <div class="form-floating">
                        <select class="form-select" id="expenseFilterCategoryId" name="categoryId">
                            <option th:selected="${expenseSearch.categoryId == null}" th:value="${null}">Todas las categor&iacute;as</option>
                            <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}" th:selected="${category.id == expenseSearch.getCategoryId()}"></option>
                        </select>
                        <label for="expenseFilterCategoryId">Categor&iacute;a</label>
                    </div>
                </div>
                <div class="col-12 col-lg-4 col-xxl-2">
                    <div class="form-floating">
                        <select class="form-select" id="expenseFilterAccountId" name="accountId" th:disabled="${accounts.size() == 1}">
                            <option th:if="${accounts.size() > 1}" th:selected="${expenseSearch.accountId == null}" th:value="${null}">Todas las cuentas</option>
                            <option th:each="account : ${accounts}" th:value="${account.id}" th:text="${account.name}" th:selected="${account.id == expenseSearch.accountId}"></option>
                        </select>
                        <label for="expenseFilterAccountId">Cuenta</label>
                    </div>
                </div>
                <div class="col-12 text-lg-end">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-search"></i></button>
                </div>
            </div>
        </div>

        <div class="row g-0 align-items-center my-2">
            <div class="col-12 col-md me-auto"><h3>Registro de ingresos/egresos</h3></div>
            <div class="col-auto">
                <div class="input-group input-group-sm me-3">
                    <input type="number" style="max-width:50px" min="1" max="999" class="form-control px-1 text-end" id="size" name="size" aria-label="Registros por p&aacute;gina" th:value="${expensesPage.size}">
                    <span class="input-group-text" th:text="${'/ ' + expensesPage.totalElements}"></span>
                </div>
            </div>
            <div class="col-auto">
                <button type="button" class="btn btn-sm btn-success text-nowrap" onclick="addExpenseRow()">
                    <i class="bi bi-plus me-2"></i>Nuevo registro
                </button>
            </div>
        </div>

        <table class="table table-sm table-bordered table-striped">
            <thead class="text-center">
            <tr>
                <th>Fecha</th>
                <th>Descripci&oacute;n</th>
                <th class="d-none d-lg-table-cell">Detalle</th>
                <th class="d-none d-lg-table-cell">Categor&iacute;a</th>
                <th class="d-none d-lg-table-cell" th:if="${expenseSearch.accountId == null}">Cuenta</th>
                <th>Importe</th>
                <th class="d-none d-lg-table-cell" colspan="4">Acciones</th>
            </tr>
            </thead>
            <tbody id="expensesTableBody">
            <tr th:if="${#lists.isEmpty(expensesPage.content)}">
                <td colspan="9">No hay registros para mostrar!</td>
            </tr>
            <tr th:unless="${#lists.isEmpty(expensesPage.content)}"
                th:each="expense : ${expensesPage.content}"
                th:attr="
                data-expense-id=${expense.id},
                data-date=${#temporals.format(expense.date,'yyyy-MM-dd')},
                data-description=${expense.description},
                data-details=${expense.details},
                data-amount=${expense.amount},
                data-category-id=${expense.category.id},
                data-account-id=${expense.account != null ? expense.account.id : ''}">
                <td class="text-center" style="width:100px" th:text="${#temporals.format(expense.date, 'dd/MM/yyyy')}"></td>
                <td class="text-start" th:text="${expense.description}"></td>
                <td class="text-start d-none d-lg-table-cell" th:text="${expense.details}"></td>
                <td class="text-center d-none d-lg-table-cell" th:text="${expense.category.name}"></td>
                <td class="text-center d-none d-lg-table-cell" th:text="${expense.account != null ? expense.account.name : ''}" th:if="${expenseSearch.accountId == null}"></td>
                <td class="text-center">
                    <div class="d-flex flex-nowrap">
                        <span class="col text-end" th:text="${#numbers.formatDecimal(expense.amount, 1, 'POINT', 2, 'COMMA')}"></span>
                        <span class="col-auto px-2" th:text="${expense.account != null && expense.account.currency != null ? expense.account.currency : 'ARS'}"></span>
                    </div>
                </td>
                <td class="text-center d-none d-lg-table-cell" style="width:35px"><button th:disabled="${#strings.isEmpty(expense.comments)}" type="button" class="btn btn-link p-0" data-bs-title="Comentario" data-bs-custom-class="custom-popover" data-bs-container="body" data-bs-toggle="popover" data-bs-placement="left" th:attr="data-bs-content=|${expense.comments}|"><i class="bi bi-chat-text"></i></button></td>
                <td class="text-center d-none d-lg-table-cell" style="width:35px"><button type="button"class="btn btn-link p-0"onclick="editExpenseRow(this)"><i class="bi bi-pencil-square"></i></button></td>
                <td class="text-center d-none d-lg-table-cell" style="width:35px"><button type="button" class="btn btn-link p-0" onclick="duplicateExpenseRow(this)"><i class="bi bi-files"></i></button></td>
                <td class="text-center d-none d-lg-table-cell" style="width:35px"><button type="button" class="btn btn-link p-0" th:onclick="'deleteExpense(' + ${expense.id} + ')'"><i class="bi bi-trash text-danger"></i></button></td>
            </tr>
            </tbody>
            <tfoot>
            <tr th:each="onPageTotalAmountsAcumByCurrency : ${expensesPage.getOnPageTotalAmountsAcumByCurrency()}">
                <td class="text-end" th:colspan="${expenseSearch.accountId == null ? 5 : 4}">Total en pantalla</td>
                <td class="text-end">
                    <div class="d-flex flex-nowrap">
                        <span class="col text-end" th:text="${#numbers.formatDecimal(onPageTotalAmountsAcumByCurrency.value, 1, 'POINT', 2, 'COMMA')}"></span>
                        <span class="col-auto px-2" th:text="${onPageTotalAmountsAcumByCurrency.key}"></span>
                    </div>
                </td>
                <td colspan="4"></td>
            </tr>
            <tr th:each="totalAmountsAcumByCurrency : ${expensesPage.getTotalAmountsAcumByCurrency()}">
                <td class="text-end" th:colspan="${expenseSearch.accountId == null ? 5 : 4}">Total de todos los registros</td>
                <td class="text-end">
                    <div class="d-flex flex-nowrap">
                        <span class="col text-end" th:text="${#numbers.formatDecimal(totalAmountsAcumByCurrency.value, 1, 'POINT', 2, 'COMMA')}"></span>
                        <span class="col-auto px-2" th:text="${totalAmountsAcumByCurrency.key}"></span>
                    </div>
                </td>
                <td colspan="4"></td>
            </tr>
            </tfoot>
        </table>

        <nav th:if="${totalPages > 1}">
            <ul class="pagination pagination-sm justify-content-center">

                <!-- primera -->
                <li class="page-item" th:classappend="${!hasPrevious ? 'disabled' : ''}">
                    <button class="page-link" type="button" onclick="setPage(1)">
                        <i class="bi bi-chevron-double-left"></i>
                    </button>
                </li>

                <!-- anterior -->
                <li class="page-item" th:classappend="${!hasPrevious ? 'disabled' : ''}">
                    <button class="page-link"
                            type="button"
                            th:onclick="'setPage(' + ${currentPage - 1} + ')'">
                        <i class="bi bi-chevron-left"></i>
                    </button>
                </li>

                <!-- páginas -->
                <li class="page-item"
                    th:each="pageNumber : ${pageNumbers}"
                    th:classappend="${pageNumber == currentPage ? 'active' : ''}">

                    <button type="button"
                            class="page-link"
                            th:onclick="'setPage(' + ${pageNumber} + ')'"
                            th:text="${pageNumber}">
                    </button>

                </li>

                <!-- siguiente -->
                <li class="page-item" th:classappend="${!hasNext ? 'disabled' : ''}">
                    <button class="page-link"
                            type="button"
                            th:onclick="'setPage(' + ${currentPage + 1} + ')'">
                        <i class="bi bi-chevron-right"></i>
                    </button>
                </li>

                <!-- última -->
                <li class="page-item" th:classappend="${!hasNext ? 'disabled' : ''}">
                    <button class="page-link"
                            type="button"
                            th:onclick="'setPage(' + ${totalPages} + ')'">
                        <i class="bi bi-chevron-double-right"></i>
                    </button>
                </li>
            </ul>
        </nav>

        <template id="expenseEditRowTemplate">
            <tr class="table-warning">
                <td><input type="date" class="form-control form-control-sm" name="date"></td>
                <td><input class="form-control form-control-sm" name="description"></td>
                <td class="d-none d-lg-table-cell"><input class="form-control form-control-sm" name="details"></td>
                <td class="d-none d-lg-table-cell">
                    <select class="form-select form-select-sm" name="category.id">
                        <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option>
                    </select>
                </td>
                <td th:if="${expenseSearch.accountId == null}" class="d-none d-lg-table-cell">
                    <select class="form-select form-select-sm" name="account.id">
                        <option th:each="account : ${accounts}" th:value="${account.id}" th:text="${account.name}">
                        </option>
                    </select>
                </td>

                <input type="hidden" th:if="${expenseSearch.accountId != null}" name="account.id" th:value="${expenseSearch.accountId}" />

                <td><input class="form-control form-control-sm text-end" type="number" step=".01" name="amount"></td>
                <td colspan="2" class="text-center">
                    <button type="button" class="btn btn-sm btn-success" onclick="saveExpense(this)">
                        <i class="bi bi-save"></i>
                    </button>
                </td>
                <td colspan="2" class="text-center">
                    <button type="button" class="btn btn-sm btn-secondary" onclick="cancelEdit(this)">
                        <i class="bi bi-x"></i>
                    </button>
                </td>
            </tr>
        </template>
    </form>

    <script th:inline="javascript">
        const expenseSaveUrlAjax = [[@{/expenses/save-ajax}]];
        const expenseDeleteUrlAjax = [[@{/expenses/delete-ajax/}]];

        $(function () {
            $('[data-bs-toggle="popover"]').each(function () {
                new bootstrap.Popover(this);
            });
        });

        function addExpenseRow() {
            if ($(".editing-row").length) return;

            const template = $("#expenseEditRowTemplate")[0];
            const clone = template.content.cloneNode(true);

            const row = $(clone).find("tr");

            row.addClass("editing-row");
            row.data("expense-id", null);

            const today = new Date().toISOString().split("T")[0];

            row.find("[name=date]").val(today);

            $("#expensesTableBody").prepend(row);

            row.find("[name=description]").focus();
        }

        function duplicateExpenseRow(button) {
            if ($(".editing-row").length) return;

            const sourceRow = $(button).closest("tr");

            const template = $("#expenseEditRowTemplate")[0];
            const clone = template.content.cloneNode(true);

            const row = $(clone).find("tr");

            row.addClass("editing-row");

            row.find("[name=date]").val(sourceRow.data("date"));
            row.find("[name=description]").val(sourceRow.data("description"));
            row.find("[name=details]").val(sourceRow.data("details"));
            row.find("[name=amount]").val(sourceRow.data("amount"));

            row.find("[name='category.id']").val(sourceRow.data("category-id"));
            row.find("[name='account.id']").val(sourceRow.data("account-id"));

            $("#expensesTableBody").prepend(row);
        }

        function editExpenseRow(button) {
            if ($(".editing-row").length) return;

            const sourceRow = $(button).closest("tr");

            const template = $("#expenseEditRowTemplate")[0];
            const clone = template.content.cloneNode(true);

            const row = $(clone).find("tr");

            row.addClass("editing-row");

            row.data("expense-id", sourceRow.data("expense-id"));
            row.data("original-row", sourceRow);

            row.find("[name=date]").val(sourceRow.data("date"));
            row.find("[name=description]").val(sourceRow.data("description"));
            row.find("[name=details]").val(sourceRow.data("details"));
            row.find("[name=amount]").val(sourceRow.data("amount"));

            row.find("[name='category.id']").val(sourceRow.data("category-id"));
            row.find("[name='account.id']").val(sourceRow.data("account-id"));

            sourceRow.replaceWith(row);
        }

        function cancelEdit(button) {
            const row = $(button).closest("tr");
            const originalRow = row.data("original-row");

            if (originalRow) {
                row.replaceWith(originalRow);
            } else {
                row.remove();
            }
        }

        function saveExpense(button) {

            const row = $(button).closest("tr");

            const data = {
                id: row.data("expense-id") || null,
                date: row.find("[name='date']").val(),
                description: row.find("[name='description']").val(),
                details: row.find("[name='details']").val(),
                amount: row.find("[name='amount']").val(),
                category: {
                    id: row.find("[name='category.id']").val()
                },
                account: {
                    id: row.find("[name='account.id']").val()
                }
            };

            const $button = $(button);

            $button.prop("disabled", true);
            $button.html('<i class="bi bi-hourglass"></i>');

            fetch(expenseSaveUrlAjax, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            })
                .then(() => {
                    row.find("input,select").prop("disabled", true);
                    $("#expenseSearchForm").submit();
                });
        }

        function deleteExpense(id){
            fetch(expenseDeleteUrlAjax + id, {
                method: "POST"
            })
                .then(() => {
                    $("#expenseSearchForm").submit();
                });
        }

        $(document).on("keydown", ".editing-row input", function(e){
            if (e.key === "Enter"){
                e.preventDefault();
                saveExpense($(this).closest("tr").find(".btn-success")[0]);
            }
        });

        $("#expenseSearchForm input, #expenseSearchForm select")
            .not("[name=page]")
            .on("change", function(){
                $("input[name=page]").val(1);
            });

        function setPage(page){
            $("#page").val(page);
            $("#expenseSearchForm").submit();
        }

        function clearFilter(el) {
            event.preventDefault();
            const field = $(el).data("field");
            const $input = $("#expenseSearchForm [name='" + field + "']");
            if ($input.is("select")){
                $input.prop("selectedIndex", 0);
            } else {
                $input.val("");
            }
            setPage(1);
        }
    </script>
</div>
</body>
</html>
