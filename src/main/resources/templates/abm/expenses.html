<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://ultraq.net.nz/thymeleaf/layout"
      lang="es"
      layout:decorate="~{fragments/layout}">
<head>
    <title layout:fragment="page-title">Personal Finances App - Movimientos</title>
</head>
<body>
<div class="container-fluid p-4 overflow-y-auto" layout:fragment="content">
    <form id="expenseSearchForm" th:action="@{${'/expenses' + urlParams}}" th:object="${expenseSearch}" method="post"
          th:with="urlParams=${#strings.isEmpty(httpServletRequest.queryString) ? '' : '?' + httpServletRequest.queryString},backUrl=${'/expenses' + urlParams}">
        <input type="hidden" id="page" name="page" th:value="${currentPage}">

        <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
            <div th:if="${selectedAccount != null}" class="d-flex flex-wrap align-items-center gap-3 pe-3 me-1 border-end">
                <div class="d-flex align-items-center gap-2">
                    <img th:if="${!#strings.isEmpty(selectedAccountIcon)}"
                         th:src="@{/images/{image}(image=${selectedAccountIcon})}"
                         th:alt="${selectedAccount.name}"
                         style="width:28px;height:28px;object-fit:contain">
                    <i th:if="${#strings.isEmpty(selectedAccountIcon)}"
                       class="bi fs-4"
                       th:classappend="${selectedAccount.type.name() == 'BANK_ACCOUNT' ? ' bi-bank2' : (selectedAccount.type.name() == 'CREDIT_CARD' ? ' bi-credit-card' : ' bi-wallet2')}"></i>
                    <div class="lh-sm">
                        <div class="fw-semibold" th:text="${selectedAccount.name}"></div>
                        <small class="text-body-secondary" th:text="${selectedAccount.currency}"></small>
                    </div>
                </div>
                <div th:if="${selectedAccount.syncEnabled || selectedAccount.lastSyncAt != null}" class="lh-sm">
                    <small class="d-block text-body-secondary">&Uacute;ltima sincronizaci&oacute;n</small>
                    <span class="small" th:if="${selectedAccount.lastSyncAt != null}" th:text="${#temporals.format(selectedAccount.lastSyncAt, 'dd/MM/yyyy HH:mm:ss')}"></span>
                    <span class="small" th:unless="${selectedAccount.lastSyncAt != null}">Pendiente</span>
                </div>
                <div class="lh-sm">
                    <small class="d-block text-body-secondary">Total de todos los registros</small>
                    <div class="d-flex flex-wrap gap-2">
                        <span class="fw-semibold" th:each="totalAmount : ${expensesPage.getTotalAmountsAcumByCurrency()}">
                            <span th:text="${#numbers.formatDecimal(totalAmount.value, 1, 'POINT', 2, 'COMMA')}"></span>
                            <span th:text="${totalAmount.key}"></span>
                        </span>
                    </div>
                </div>
            </div>
            <th:block th:each="chip : ${filterChips}">
                <div class="badge rounded-pill bg-primary" style="--bs-badge-font-size:.875rem">
                    <span th:text="${chip.displayValue}"></span>
                    <!-- Replico el comportamiento del select de cuentas, si vino solo 1, no puedo sacar este filtro -->
                    <a href="#" th:if="${!(chip.field == 'accountId' and accounts.size() == 1)}"
                       th:attr="data-field=${chip.field}" onclick="clearFilter(this)" class="text-white ms-1">
                        <i class="bi bi-x-lg ms-1"></i>
                    </a>
                </div>
            </th:block>
<!-- FIXME: Este boton en realidad no esta limpiando filtros, sino que esta llamando a la pagina sin ningun filtro puesto, y pierdo la cuenta elegida -->
<!--            <a th:if="${expenseSearch.hasFilters()}" th:href="@{/expenses}" class="btn btn-sm btn-outline-danger ms-2"><i class="bi bi-x-circle me-1"></i>Limpiar</a>-->

            <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-toggle="collapse" data-bs-target="#filtersPanel"><i class="bi bi-filter me-2"></i>Filtros</button>
        </div>
        <div id="filtersPanel" class="collapse">
            <div class="row g-3">
                <div class="col-12 col-lg-4 col-xxl-2">
                    <div class="form-floating">
                        <input type="date" class="form-control" id="expenseFilterDate" name="date" th:value="${#temporals.format(expenseSearch.getDate(), 'yyyy-MM-dd')}" placeholder="Fecha">
                        <label for="expenseFilterDate">Fecha</label>
                    </div>
                </div>
                <div class="col-12 col-lg-4 col-xxl-2">
                    <div class="form-floating">
                        <input type="date" class="form-control" id="expenseFilterDateFrom" name="dateFrom" th:value="${#temporals.format(expenseSearch.getDateFrom(), 'yyyy-MM-dd')}" placeholder="Fecha desde">
                        <label for="expenseFilterDateFrom">Fecha desde</label>
                    </div>
                </div>
                <div class="col-12 col-lg-4 col-xxl-2">
                    <div class="form-floating">
                        <input type="date" class="form-control" id="expenseFilterDateTo" name="dateTo" th:value="${#temporals.format(expenseSearch.getDateTo(), 'yyyy-MM-dd')}" placeholder="Fecha hasta">
                        <label for="expenseFilterDateTo">Fecha hasta</label>
                    </div>
                </div>
                <div class="col-12 col-lg-4 col-xxl-2">
                    <div class="form-floating">
                        <input type="number" step=".01" class="form-control" id="expenseFilterAmount" name="amount" th:value="${expenseSearch.getAmount()}" placeholder="Importe">
                        <label for="expenseFilterAmount">Importe</label>
                    </div>
                </div>
                <div class="col-12 col-lg-4 col-xxl-2">
                    <div class="form-floating">
                        <input type="number" step=".01" class="form-control" id="expenseFilterAmountFrom" name="amountFrom" th:value="${expenseSearch.getAmountFrom()}" placeholder="Importe desde">
                        <label for="expenseFilterAmountFrom">Importe desde</label>
                    </div>
                </div>
                <div class="col-12 col-lg-4 col-xxl-2">
                    <div class="form-floating">
                        <input type="number" step=".01" class="form-control" id="expenseFilterAmountTo" name="amountTo" th:value="${expenseSearch.getAmountTo()}" placeholder="Importe hasta">
                        <label for="expenseFilterAmountTo">Importe hasta</label>
                    </div>
                </div>
                <div class="col-12 col-lg-4 col-xxl-2">
                    <label for="expenseFilterDescription" class="form-label mb-1">Descripci&oacute;n</label>
                    <div class="input-group">
                        <select class="form-select" id="expenseFilterDescriptionOperator" name="descriptionOperator" data-default-operator="CONTAINS" style="max-width:75px">
                            <option th:each="operator : ${stringFilterOperators}"
                                    th:value="${operator.name()}"
                                    th:selected="${operator == expenseSearch.descriptionOperator}"
                                    th:text="${operator.symbol}">
                            </option>
                        </select>

                        <input type="text" class="form-control" id="expenseFilterDescription" name="description" th:value="${expenseSearch.description}" placeholder="Descripci&oacute;n">
                    </div>
                </div>
                <div class="col-12 col-lg-4 col-xxl-2">
                    <label for="expenseFilterDetails" class="form-label mb-1">Detalle</label>
                    <div class="input-group">
                        <select class="form-select" id="expenseFilterDetailsOperator" name="detailsOperator" data-default-operator="CONTAINS" style="max-width:75px">
                            <option th:each="operator : ${stringFilterOperators}"
                                    th:value="${operator.name()}"
                                    th:selected="${operator == expenseSearch.detailsOperator}"
                                    th:text="${operator.symbol}">
                            </option>
                        </select>

                        <input type="text" class="form-control" id="expenseFilterDetails" name="details" th:value="${expenseSearch.details}" placeholder="Detalle">
                    </div>
                </div>
                <div class="col-12 col-lg-4 col-xxl-2">
                    <label for="expenseFilterComments" class="form-label mb-1">Comentario</label>
                    <div class="input-group">
                        <select class="form-select" id="expenseFilterCommentsOperator" name="commentsOperator" data-default-operator="CONTAINS" style="max-width:75px">
                            <option th:each="operator : ${stringFilterOperators}"
                                    th:value="${operator.name()}"
                                    th:selected="${operator == expenseSearch.commentsOperator}"
                                    th:text="${operator.symbol}">
                            </option>
                        </select>

                        <input type="text" class="form-control" id="expenseFilterComments" name="comments" th:value="${expenseSearch.comments}" placeholder="Comentario">
                    </div>
                </div>
                <div class="col-12 col-lg-4 col-xxl-2">
                    <div class="form-floating">
                        <select class="form-select" id="expenseFilterCategoryId" name="categoryId">
                            <option th:selected="${expenseSearch.categoryId == null}" th:value="${null}">Todas las categor&iacute;as</option>
                            <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}" th:selected="${category.id == expenseSearch.getCategoryId()}"></option>
                        </select>
                        <label for="expenseFilterCategoryId">Categor&iacute;a</label>
                    </div>
                </div>
                <div class="col-12 text-lg-end">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-search"></i></button>
                </div>
            </div>
        </div>

        <div class="row gy-0 gx-3 align-items-center my-2">
            <div class="col-12 col-md me-auto"><h3>Registro de ingresos/egresos</h3></div>
            <div class="col-auto">
                <div class="input-group input-group-sm">
                    <input type="number" style="max-width:50px" min="1" max="999" class="form-control px-1 text-end" id="size" name="size" aria-label="Registros por p&aacute;gina" th:value="${expensesPage.size}">
                    <span class="input-group-text" th:text="${'/ ' + expensesPage.totalElements}"></span>
                </div>
            </div>
            <div class="col-auto">
                <button type="button" class="btn btn-sm btn-outline-primary text-nowrap" onclick="toggleBulkEditMode()">
                    <i class="bi bi-table me-2"></i>Edici&oacute;n m&uacute;ltiple
                </button>
            </div>
            <div class="col-auto">
                <button type="button" class="btn btn-sm btn-success text-nowrap" onclick="addExpenseRow()">
                    <i class="bi bi-plus me-2"></i>Nuevo registro
                </button>
            </div>
        </div>

        <table class="table table-sm table-bordered align-middle">
            <thead class="text-center">
            <tr>
                <th class="bulk-edit-column d-none" style="width:35px"><input type="checkbox" id="bulkSelectAll" checked></th>
                <th>Fecha</th>
                <th>Descripci&oacute;n</th>
                <th>Detalle</th>
                <th>Categor&iacute;a</th>
                <th>Importe</th>
                <th colspan="4">Acciones</th>
            </tr>
            <tr id="bulkEditRow" class="table-warning d-none">
                <td class="bulk-edit-column text-center"><i class="bi bi-lightning-charge"></i></td>
                <td class="bulk-cell" data-field="date">
                    <div class="d-flex align-items-center gap-1">
                        <button type="button" class="btn btn-sm btn-link bulk-toggle"><i class="bi bi-pencil"></i></button>
                        <input type="date" class="form-control form-control-sm d-none bulk-input">
                    </div>
                </td>
                <td class="bulk-cell" data-field="description">
                    <div class="d-flex align-items-center gap-1">
                        <button type="button" class="btn btn-sm btn-link bulk-toggle"><i class="bi bi-pencil"></i></button>
                        <input type="text" class="form-control form-control-sm d-none bulk-input" placeholder="Descripcioacute;n">
                    </div>
                </td>
                <td class="bulk-cell d-none d-lg-table-cell" data-field="details">
                    <div class="d-flex align-items-center gap-1">
                        <button type="button" class="btn btn-sm btn-link bulk-toggle"><i class="bi bi-pencil"></i></button>
                        <input type="text" class="form-control form-control-sm d-none bulk-input" placeholder="Detalle">
                    </div>
                </td>
                <td class="bulk-cell d-none d-lg-table-cell" data-field="categoryId">
                    <div class="d-flex align-items-center gap-1">
                        <button type="button" class="btn btn-sm btn-link bulk-toggle"><i class="bi bi-pencil"></i></button>
                        <select class="form-select form-select-sm d-none bulk-input">
                            <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option>
                        </select>
                    </div>
                </td>
                <td></td>
                <td colspan="4" class="text-center">
                    <div class="d-flex gap-2 justify-content-center">
                        <button type="button" id="bulkSaveButton" class="btn btn-sm btn-success" disabled onclick="saveBulkEdit()"><i class="bi bi-save"></i></button>
                        <button type="button" class="btn btn-sm btn-secondary" onclick="toggleBulkEditMode(false)"><i class="bi bi-x-lg"></i></button>
                    </div>
                </td>
            </tr>
            </thead>
            <tbody th:if="${#lists.isEmpty(expensesPage.content)}">
                <tr><td colspan="9">No hay registros para mostrar!</td></tr>
            </tbody>
            <tbody th:unless="${#lists.isEmpty(expensesPage.content)}" class="expense-group"
                   th:each="expense : ${expensesPage.content}"
                   th:attr="
                   data-expense-id=${expense.id},
                   data-date=${#temporals.format(expense.date,'yyyy-MM-dd')},
                   data-description=${expense.description},
                   data-details=${expense.details},
                   data-amount=${expense.amount},
                   data-category-id=${expense.category.id},
                   data-account-id=${expense.account != null ? expense.account.id : ''},
                   data-comments=${expense.comments}">
                <tr>
                    <td class="bulk-edit-column text-center d-none">
                        <input type="checkbox" class="bulk-expense-selector" th:value="${expense.id}" checked>
                    </td>
                    <td class="text-center filterable" data-field="date" style="width:100px" th:attr="data-value=${#temporals.format(expense.date,'yyyy-MM-dd')}">
                        <span th:text="${#temporals.format(expense.date, 'dd/MM/yyyy')}"></span>
                        <i class="bi bi-funnel filter-icon"></i>
                    </td>
                    <td class="text-start filterable" data-field="description">
                        <span th:text="${expense.description}"></span>
                        <i class="bi bi-funnel filter-icon"></i>
                    </td>
                    <td class="text-start filterable" data-field="details">
                        <span th:text="${expense.details}"></span>
                        <i class="bi bi-funnel filter-icon"></i>
                    </td>
                    <td class="text-center filterable" data-field="categoryId" th:attr="data-value=${expense.category.id}">
                        <span th:text="${expense.category.name}"></span>
                        <i class="bi bi-funnel filter-icon" th:title="${'Filtrar por categor&iacute;a: ' + expense.category.name}"></i>
                    </td>
                    <td class="text-center">
                        <div class="d-flex flex-nowrap">
                            <span class="col text-end" th:text="${#numbers.formatDecimal(expense.amount, 1, 'POINT', 2, 'COMMA')}"></span>
                            <span class="col-auto px-2" th:text="${expense.account != null && expense.account.currency != null ? expense.account.currency : 'ARS'}"></span>
                        </div>
                    </td>
                    <td class="text-center" style="width:35px"><button th:disabled="${#strings.isEmpty(expense.comments)}" type="button" class="btn btn-link p-0" data-bs-title="Comentario" data-bs-custom-class="custom-popover" data-bs-container="body" data-bs-toggle="popover" data-bs-placement="left" th:attr="data-bs-content=|${expense.comments}|"><i class="bi bi-chat-text"></i></button></td>
                    <td class="text-center" style="width:35px"><button type="button"class="btn btn-link p-0"onclick="editExpenseRow(this)"><i class="bi bi-pencil-square"></i></button></td>
                    <td class="text-center" style="width:35px"><button type="button" class="btn btn-link p-0" onclick="duplicateExpenseRow(this)"><i class="bi bi-files"></i></button></td>
                    <td class="text-center" style="width:35px"><button type="button" class="btn btn-link p-0" th:onclick="'deleteExpense(' + ${expense.id} + ')'"><i class="bi bi-trash text-danger"></i></button></td>
                </tr>
            </tbody>
            <tfoot>
            <tr th:each="onPageTotalAmountsAcumByCurrency : ${expensesPage.getOnPageTotalAmountsAcumByCurrency()}">
                <td class="text-end" colspan="4">Total en pantalla</td>
                <td class="text-end">
                    <div class="d-flex flex-nowrap">
                        <span class="col text-end" th:text="${#numbers.formatDecimal(onPageTotalAmountsAcumByCurrency.value, 1, 'POINT', 2, 'COMMA')}"></span>
                        <span class="col-auto px-2" th:text="${onPageTotalAmountsAcumByCurrency.key}"></span>
                    </div>
                </td>
                <td colspan="4"></td>
            </tr>
            </tfoot>
        </table>

        <nav th:if="${totalPages > 1}">
            <ul class="pagination pagination-sm justify-content-center">

                <!-- primera -->
                <li class="page-item" th:classappend="${!hasPrevious ? 'disabled' : ''}">
                    <button class="page-link" type="button" onclick="setPage(1)">
                        <i class="bi bi-chevron-double-left"></i>
                    </button>
                </li>

                <!-- anterior -->
                <li class="page-item" th:classappend="${!hasPrevious ? 'disabled' : ''}">
                    <button class="page-link"
                            type="button"
                            th:onclick="'setPage(' + ${currentPage - 1} + ')'">
                        <i class="bi bi-chevron-left"></i>
                    </button>
                </li>

                <!-- páginas -->
                <li class="page-item"
                    th:each="pageNumber : ${pageNumbers}"
                    th:classappend="${pageNumber == currentPage ? 'active' : ''}">

                    <button type="button"
                            class="page-link"
                            th:onclick="'setPage(' + ${pageNumber} + ')'"
                            th:text="${pageNumber}">
                    </button>

                </li>

                <!-- siguiente -->
                <li class="page-item" th:classappend="${!hasNext ? 'disabled' : ''}">
                    <button class="page-link"
                            type="button"
                            th:onclick="'setPage(' + ${currentPage + 1} + ')'">
                        <i class="bi bi-chevron-right"></i>
                    </button>
                </li>

                <!-- última -->
                <li class="page-item" th:classappend="${!hasNext ? 'disabled' : ''}">
                    <button class="page-link"
                            type="button"
                            th:onclick="'setPage(' + ${totalPages} + ')'">
                        <i class="bi bi-chevron-double-right"></i>
                    </button>
                </li>
            </ul>
        </nav>

        <template id="expenseEditGroupTemplate">
            <tbody class="editing-group table-warning">
                <tr>
                    <td><input type="date" class="form-control form-control-sm" name="date"></td>
                    <td><input class="form-control form-control-sm" name="description"></td>
                    <td><input class="form-control form-control-sm" name="details"></td>
                    <td>
                        <select class="form-select form-select-sm" name="category.id">
                            <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option>
                        </select>
                    </td>
                    <td><input class="form-control form-control-sm text-end" type="number" step=".01" name="amount"></td>
                    <td colspan="2" rowspan="2" class="text-center" style="width:70px">
                        <button type="button" class="btn btn-sm btn-success" onclick="saveExpense(this)">
                            <i class="bi bi-save"></i>
                        </button>
                    </td>
                    <td colspan="2" rowspan="2" class="text-center" style="width:70px">
                        <button type="button" class="btn btn-sm btn-secondary" onclick="cancelEdit(this)">
                            <i class="bi bi-x-lg"></i>
                        </button>
                    </td>
                </tr>
                <tr>
                    <td class="text-end">Comentario</td>
                    <td colspan="2"><input class="form-control form-control-sm" name="comments"></td>
                    <td class="text-end">Cuenta</td>
                    <td>
                        <select class="form-select form-select-sm" name="account.id">
                            <option th:each="account : ${accounts}" th:value="${account.id}" th:text="${account.name}">
                            </option>
                        </select>
                    </td>
                </tr>
            </tbody>
        </template>
    </form>

    <script th:inline="javascript">
        const expenseSaveUrlAjax = [[@{/expenses/save-ajax}]];
        const expenseDeleteUrlAjax = [[@{/expenses/delete-ajax/}]];
        const expenseBulkUpdateUrl = [[@{/expenses/bulk-update}]];

        $(function () {
            $('[data-bs-toggle="popover"]').each(function () {
                new bootstrap.Popover(this);
            });

            ["expenseFilterDescription", "expenseFilterDetails", "expenseFilterComments"].forEach(function(field){
                $("#" + field + "Operator").on("change", function(){
                    toggleStringFilterInput(field);
                });

                toggleStringFilterInput(field);
            });
        });

        function addExpenseRow() {
            if ($(".editing-group").length) return;

            const template = $("#expenseEditGroupTemplate")[0];
            const clone = template.content.cloneNode(true);

            const group = $(clone).find(".editing-group");

            group.data("expense-id", null);

            const today = new Date().toISOString().split("T")[0];

            group.find("[name=date]").val(today);

            $(".expense-group").first().before(group);

            group.find("[name=description]").focus();
        }

        function duplicateExpenseRow(button) {
            if ($(".editing-group").length) return;

            const sourceGroup = $(button).closest(".expense-group");

            const template = $("#expenseEditGroupTemplate")[0];
            const clone = template.content.cloneNode(true);

            const group = $(clone).find(".editing-group");

            group.find("[name=date]").val(sourceGroup.data("date"));
            group.find("[name=description]").val(sourceGroup.data("description"));
            group.find("[name=details]").val(sourceGroup.data("details"));
            group.find("[name=amount]").val(sourceGroup.data("amount"));
            group.find("[name=comments]").val(sourceGroup.data("comments"));

            group.find("[name='category.id']").val(sourceGroup.data("category-id"));
            group.find("[name='account.id']").val(sourceGroup.data("account-id"));

            $(".expense-group").first().before(group);

            group.find("[name=description]").focus();
        }

        function editExpenseRow(button) {
            if ($(".editing-group").length) return;

            const sourceGroup = $(button).closest(".expense-group");

            const template = $("#expenseEditGroupTemplate")[0];
            const clone = template.content.cloneNode(true);

            const group = $(clone).find(".editing-group");

            group.data("expense-id", sourceGroup.data("expense-id"));
            group.data("original-group", sourceGroup);

            group.find("[name=date]").val(sourceGroup.data("date"));
            group.find("[name=description]").val(sourceGroup.data("description"));
            group.find("[name=details]").val(sourceGroup.data("details"));
            group.find("[name=amount]").val(sourceGroup.data("amount"));
            group.find("[name=comments]").val(sourceGroup.data("comments"));
            group.find("[name='category.id']").val(sourceGroup.data("category-id"));
            group.find("[name='account.id']").val(sourceGroup.data("account-id"));

            sourceGroup.replaceWith(group);

            group.find("[name=description]").focus();
        }

        function cancelEdit(button) {
            const group = $(button).closest(".editing-group");
            const originalGroup = group.data("original-group");

            if (originalGroup) {
                group.replaceWith(originalGroup);
            } else {
                group.remove();
            }
        }

        function saveExpense(button) {

            const group = $(button).closest(".editing-group");

            const data = {
                id: group.data("expense-id") || null,
                date: group.find("[name='date']").val(),
                description: group.find("[name='description']").val(),
                details: group.find("[name='details']").val(),
                amount: group.find("[name='amount']").val(),
                comments: group.find("[name='comments']").val(),
                category: {
                    id: group.find("[name='category.id']").val()
                },
                account: {
                    id: group.find("[name='account.id']").val()
                }
            };

            const $button = $(button);

            $button.prop("disabled", true);
            $button.html('<i class="bi bi-hourglass"></i>');

            fetch(expenseSaveUrlAjax, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            })
                .then(() => {
                    group.find("input,select").prop("disabled", true);
                    $("#expenseSearchForm").submit();
                });
        }

        function deleteExpense(id){
            fetch(expenseDeleteUrlAjax + id, {
                method: "POST"
            })
                .then(() => {
                    $("#expenseSearchForm").submit();
                });
        }

        $(document).on("keydown", ".editing-group input", function(e){
            const group = $(this).closest(".editing-group");
            if (e.key === "Enter"){
                e.preventDefault();
                saveExpense(group.find(".btn-success")[0]);
            }
            if (e.key === "Escape") {
                e.preventDefault();
                cancelEdit(group.find(".btn-secondary")[0]);
            }
        });

        $("#expenseSearchForm input, #expenseSearchForm select")
            .not("[name=page]")
            .on("change", function(){
                $("input[name=page]").val(1);
            });

        function setPage(page){
            $("#page").val(page);
            $("#expenseSearchForm").submit();
        }

        function clearFilter(el) {
            event.preventDefault();
            const field = $(el).data("field");
            const $input = $("#expenseSearchForm [name='" + field + "']");
            const $operator = $("#expenseSearchForm [name='" + field + "Operator']");
            if ($input.is("select")) {
                $input.prop("selectedIndex", 0);
            } else {
                $input.val("");
            }

            if ($operator.length) {
                const defaultOperator = $operator.data("default-operator");
                $operator.val(defaultOperator);
                $operator.trigger("change");
            }
            setPage(1);
        }

        $(document).on("click", ".filter-icon", function(e){
            e.stopPropagation();

            if ($(".editing-group").length) return;

            const td = $(this).closest("td");
            const field = td.data("field");
            let value = td.data("value");
            if (value === undefined) value = td.text().trim();
            const isEmpty = value === null || value === undefined || value === "";
            const $input = $("#expenseSearchForm [name='" + field + "']");
            const $operator = $("#expenseSearchForm [name='" + field + "Operator']");
            if ($operator.length) {
                if (isEmpty) {
                    $operator.val("EMPTY");
                    $input.val("");
                } else {
                    $operator.val("CONTAINS");
                    $input.val(value);
                }

                $operator.trigger("change");
            } else {
                $input.val(value);
            }

            setPage(1);
        });

        $(document).on("mousedown", function(e){
            // Si hice click en el boton para filtrar por texto seleccionado, no hago nada
            if ($(e.target).closest("#selectionFilterButton").length) {
                return;
            }

            // Sino elimino cualquier boton que este dibujado (porque no hice click en el boton)
            $("#selectionFilterButton").remove();

        });

        $(document).on("mouseup", ".filterable", function(e){

            if ($(".editing-group").length) return;

            // Elimino cualquier boton que se haya generado
            $("#selectionFilterButton").remove();

            const selection = window.getSelection().toString().trim();

            if (!selection) {
                return;
            }

            const td = $(this);

            const button = $(`
        <button id="selectionFilterButton"
                class="btn btn-sm btn-dark position-absolute">
            <i class="bi bi-funnel"></i>
        </button>
    `);

            button.css({
                top: e.pageY + 5,
                left: e.pageX + 5,
                zIndex: 9999
            });

            $("body").append(button);

            button.on("click", function(){

                const field = td.data("field");

                const $input = $("#expenseSearchForm [name='" + field + "']");

                $input.val(selection);

                setPage(1);

            });

        });

        function toggleStringFilterInput(field){
            const operator = $("#" + field + "Operator").val();
            $("#" + field).prop("disabled", operator === "EMPTY" || operator === "NOT_EMPTY");
        }

        function toggleBulkEditMode(forceState){
            const enabled = forceState !== undefined
                    ? forceState
                    : $("#bulkEditRow").hasClass("d-none");
            $("#bulkEditRow").toggleClass("d-none", !enabled);
            $(".bulk-edit-column").toggleClass("d-none", !enabled);
        }

        $(document).on("change", "#bulkSelectAll", function(){
            $(".bulk-expense-selector").prop( "checked", this.checked);
        });

        $(document).on("click", ".bulk-toggle", function(){
            const $cell = $(this).closest(".bulk-cell");
            const $input = $cell.find(".bulk-input");
            const enabled = !$input.hasClass("d-none");
            if (enabled){
                $input.addClass("d-none");
                $cell.removeClass("table-active");
                if ($input.is("select")){
                    $input.prop("selectedIndex", 0);
                } else {
                    $input.val("");
                }
            } else {
                $input.removeClass("d-none");
                $cell.addClass("table-active");
                $input.focus();
            }

            refreshBulkSaveButton();
        });

        function refreshBulkSaveButton(){
            const hasActiveFields = $(".bulk-input").filter(function(){
                return !$(this).hasClass("d-none");
            }).length > 0;

            $("#bulkSaveButton").prop("disabled", !hasActiveFields);
        }

        function saveBulkEdit(){
            const expenseIds = $(".bulk-expense-selector:checked")
                .map(function(){
                    return Number($(this).val());
                })
                .get();

            if (!expenseIds.length){
                alert("No hay registros seleccionados");
                return;
            }

            const data = {
                expenseIds: expenseIds
            };

            $("#bulkEditRow .bulk-cell").each(function(){
                const $cell = $(this);
                const field = $cell.data("field");
                const $input = $cell.find(".bulk-input");

                // solo procesar campos activos
                if ($input.hasClass("d-none")) {
                    return;
                }

                let value = $input.val();

                // normalizar strings vacíos
                if (typeof value === "string"){
                    value = value.trim();
                }

                data[field] = value;
            });

            $("#bulkSaveButton").prop("disabled", true).html('<i class="bi bi-hourglass"></i>');

            fetch(expenseBulkUpdateUrl, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            }).then(() => {
                $("#expenseSearchForm").submit();
            });
        }
    </script>
</div>
</body>
</html>
