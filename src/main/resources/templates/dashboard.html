<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://ultraq.net.nz/thymeleaf/layout"
      lang="es"
      layout:decorate="~{fragments/layout}">
<head>
    <title layout:fragment="page-title">Personal Finances App - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container-fluid p-4 overflow-y-auto" layout:fragment="content">
        <h2>Dashboard</h2>
        <div class="row">
            <div class="col-lg-4 col-xl-3 col-xxl" th:each="account : ${accountsBalances}">
                <div class="card mt-3 account-card cursor-pointer" th:attr="data-href=@{/expenses(accountName=${account[1]})}">
                    <div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-4 d-flex">
                                <i th:if="${#strings.isEmpty(account[4])}" class="bi bi-credit-card fs-1"></i>

                                <i th:if="${!#strings.isEmpty(account[4]) and !(account[4].endsWith('.svg') or account[4].endsWith('.png'))}"
                                   class="bi me-2"
                                   th:with="icon=${account[4]}"
                                   th:classappend="${'bi-' + icon}"></i>

                                <img th:if="${!#strings.isEmpty(account[4]) and (account[4].endsWith('.svg') or account[4].endsWith('.png'))}"
                                     class="img-fluid align-self-center" style="max-height: 60px"
                                     th:src="@{/images/{icon}(icon=${account[4]})}">
                            </div>

                            <div class="col text-end">
                                <small class="d-block text-body-secondary" th:text="${'Galicia ARS' == account[1] ? 'Saldo actual' : 'Total consumido del período'}"/>
                                <h3 th:text="'$ ' + ${#numbers.formatDecimal(account[3], 1, 'POINT', 2, 'COMMA')}"/>
                            </div>
                        </div>

                        <canvas th:attr="id='chart-' + ${account[0]}" height="200"></canvas>
                    </div>
                    <div class="card-footer text-body-secondary d-flex justify-content-around gap-3" th:unless="${'SDD' == account[1]}">
                        <form th:action="@{/bank-sync}" th:object="${bankSyncModelAttribute}" method="post" class="d-flex justify-content-around gap-3" onclick="event.stopPropagation();">
                            <input type="hidden" name="accountName" th:value="${account[1]}">

                            <div class="input-group" th:if="${'Galicia ARS' == account[1] && account[5]}">
                                <input type="text" class="form-control" placeholder="ASP.NET_SessionId" aria-label="ASP.NET_SessionId" th:field="*{aspNetSessionId}" required>
                                <button type="submit" class="btn btn-success" title="Sincronizar con el banco"><i class="bi bi-arrow-repeat"></i></button>
                            </div>
                            <button th:if="${'Galicia ARS' == account[1] && account[5]}" type="button" class="btn btn-primary" title="Analizar movimientos del banco" onclick="submitAsLearn(this)"><i class="bi bi-eyeglasses"></i></button>
                            <button th:unless="${'Galicia ARS' == account[1]}" type="submit" class="btn btn-success" th:if="${account[5]}" title="Sincronizar con el banco"><i class="bi bi-arrow-repeat"></i></button>
                        </form>

                        <button th:if="${'Master Card' == account[1] or 'VISA' == account[1]}"
                                type="button"
                                class="btn btn-outline-danger"
                                th:attr="data-account-name=${account[1]}"
                                onclick="event.stopPropagation(); tiggerPdfUpload(this.dataset.accountName)">
                            <i class="bi bi-file-earmark-pdf"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <form id="pdfUploadForm" method="post" enctype="multipart/form-data" th:action="@{/bank-pdf}" class="d-none">
            <input  type="file" id="pdfFileInput" name="file" accept="application/pdf" />
            <input type="hidden" id="pdfAccountName" name="accountName">
        </form>
        <script>
            function tiggerPdfUpload(accountName) {
                const fileInput = document.getElementById('pdfFileInput');
                const accountInput = document.getElementById('pdfAccountName');
                const form = document.getElementById('pdfUploadForm');

                // seteamos el hidden
                accountInput.value = accountName;

                // abrimos el selector de archivo
                fileInput.click();

                fileInput.onchange = function () {
                    if (fileInput.files.length > 0) {
                        form.submit();
                    }
                };
            }

            function submitAsLearn(button) {
                const form = button.closest('form');
                if (!form) return;

                // Cambiamos la action
                form.action = form.action.replace('sync', 'learn');

                // Submit normal
                form.submit();
            }

            document.querySelectorAll('.account-card').forEach(card => {
                card.addEventListener('click', function () {
                    const href = this.dataset.href;
                    if (href) {
                        window.location.href = href;
                    }
                });
            });
        </script>

        <script th:inline="javascript">
            const chartsByAccount = /*[[${chartsByAccount}]]*/ {};

            Object.entries(chartsByAccount).forEach(([accountId, chart]) => {

                const canvas = document.getElementById('chart-' + accountId);

                if (!canvas) return;
                if (!chart || !chart.labels || chart.labels.length === 0) return;

                new Chart(canvas, {
                    type: 'doughnut',
                    data: {
                        labels: chart.labels,
                        datasets: chart.datasets
                    },
                    options: {
                        plugins: {
                            subtitle: {
                                display: !!chart.subtitle,
                                text: chart.subtitle,
                                color: '#6c757d',
                                font: {
                                    size: 12
                                },
                                padding: {
                                    bottom: 8
                                }
                            },
                            legend: {
                                position: 'bottom'
                            }
                        }
                    }
                });
            });
        </script>
    </div>
</body>
</html>
