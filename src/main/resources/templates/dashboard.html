<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://ultraq.net.nz/thymeleaf/layout"
      lang="es"
      layout:decorate="~{fragments/layout}">
<head>
    <title layout:fragment="page-title">Personal Finances App - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container-fluid p-4 overflow-y-auto" layout:fragment="content">
        <h2>Dashboard</h2>
        <div class="row">
            <div class="col-lg-4 col-xl-3 col-xxl" th:each="account : ${accountsBalances}">
                <div class="card mt-3 account-card cursor-pointer" th:attr="data-href=@{/expenses(accountName=${account[1]})}">
                    <div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-4 d-flex">
                                <i th:if="${#strings.isEmpty(account[4])}" th:class="${account[6] == 'BANK_ACCOUNT' ? 'bi bi-bank fs-1' : 'bi bi-credit-card fs-1'}"></i>

                                <i th:if="${!#strings.isEmpty(account[4]) and !account[4].endsWith('.svg') and !account[4].endsWith('.png')}"
                                   th:class="${account[4] + ' fs-1'}"></i>

                                <img th:if="${!#strings.isEmpty(account[4]) and (account[4].endsWith('.svg') or account[4].endsWith('.png'))}"
                                     class="img-fluid align-self-center" style="max-height: 60px"
                                     th:src="@{/images/{icon}(icon=${account[4]})}">
                            </div>

                            <div class="col text-end">
                                <small class="d-block text-body-secondary" th:text="${account[6] == 'BANK_ACCOUNT' ? 'Saldo actual' : 'Total consumido del período'}"/>
                                <h3 th:text="'$ ' + ${#numbers.formatDecimal(account[3], 1, 'POINT', 2, 'COMMA')}"/>
                            </div>
                        </div>

                        <canvas th:attr="id='chart-' + ${account[0]}" height="200"></canvas>
                    </div>
                    <div class="card-footer text-body-secondary d-flex justify-content-around gap-3" th:if="${account[5] or account[6] == 'CREDIT_CARD'}">
                        <form th:action="@{/bank-sync}" method="post" class="d-flex justify-content-around gap-3" onclick="event.stopPropagation();">
                            <input type="hidden" name="accountId" th:value="${account[0]}">
                            <input type="hidden" name="accountName" th:value="${account[1]}">
                            <input type="hidden" name="galiciaCookies">

                            <div th:if="${account[7] == 'GALICIA' && account[5]}" class="d-flex gap-1">
                                <button type="button" class="btn btn-sm btn-outline-success" title="Pegar cookies del portapapeles y sincronizar" onclick="galiciaSync(this, 'sync')"><i class="bi bi-arrow-repeat"></i></button>
                                <button type="button" class="btn btn-sm btn-outline-primary" title="Pegar cookies del portapapeles y analizar" onclick="galiciaSync(this, 'learn')"><i class="bi bi-eyeglasses"></i></button>
                            </div>
                            <button th:if="${account[7] != 'GALICIA' && account[5]}" type="submit" class="btn btn-success btn-sm" title="Sincronizar con el banco"><i class="bi bi-arrow-repeat"></i></button>
                        </form>

                        <button th:if="${account[6] == 'CREDIT_CARD'}"
                                type="button"
                                class="btn btn-outline-danger"
                                th:attr="data-account-name=${account[1]}"
                                onclick="event.stopPropagation(); tiggerPdfUpload(this.dataset.accountName)">
                            <i class="bi bi-file-earmark-pdf"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <form id="pdfUploadForm" method="post" enctype="multipart/form-data" th:action="@{/bank-pdf}" class="d-none">
            <input  type="file" id="pdfFileInput" name="file" accept="application/pdf" />
            <input type="hidden" id="pdfAccountName" name="accountName">
        </form>
        <script>
            function tiggerPdfUpload(accountName) {
                const fileInput = document.getElementById('pdfFileInput');
                const accountInput = document.getElementById('pdfAccountName');
                const form = document.getElementById('pdfUploadForm');

                // seteamos el hidden
                accountInput.value = accountName;

                // abrimos el selector de archivo
                fileInput.click();

                fileInput.onchange = function () {
                    if (fileInput.files.length > 0) {
                        form.submit();
                    }
                };
            }

            async function galiciaSync(button, mode) {
                const form = button.closest('form');
                const cookiesInput = form.querySelector('[name="galiciaCookies"]');

                try {
                    const text = await navigator.clipboard.readText();
                    if (!text || (!text.includes('ASP.NET_SessionId') && !text.includes('Skywalker') && !text.includes('TS'))) {
                        alert('No se detectaron cookies válidas en el portapapeles.\nCopiá las cookies del Home Banking de Galicia primero.');
                        return;
                    }
                    cookiesInput.value = text;
                    if (mode === 'learn') {
                        form.action = form.action.replace('/bank-sync', '/bank-learn');
                    }
                    form.submit();
                } catch (e) {
                    alert('No se pudo leer el portapapeles.\nCopiá las cookies manualmente y pegá el texto en el campo de cookies.');
                }
            }

            document.querySelectorAll('.account-card').forEach(card => {
                card.addEventListener('click', function () {
                    const href = this.dataset.href;
                    if (href) {
                        window.location.href = href;
                    }
                });
            });
        </script>

        <script th:inline="javascript">
            const chartsByAccount = /*[[${chartsByAccount}]]*/ {};

            Object.entries(chartsByAccount).forEach(([accountId, chart]) => {

                const canvas = document.getElementById('chart-' + accountId);

                if (!canvas) return;
                if (!chart || !chart.labels || chart.labels.length === 0) return;

                new Chart(canvas, {
                    type: 'doughnut',
                    data: {
                        labels: chart.labels,
                        datasets: chart.datasets
                    },
                    options: {
                        onClick: function(evt, elements, chart) {

                            if (!elements.length) return;

                            const index = elements[0].index;
                            const label = chart.data.labels[index];
                            const accountId = canvas.id.replace('chart-', '');
                            const baseExpensesUrl = /*[[@{/expenses}]]*/ '';

                            window.location.href = baseExpensesUrl + `?accountId=${accountId}&categoryName=${encodeURIComponent(label)}`;
                        },
                        plugins: {
                            subtitle: {
                                display: !!chart.subtitle,
                                text: chart.subtitle,
                                color: '#6c757d',
                                font: {
                                    size: 12
                                },
                                padding: {
                                    bottom: 8
                                }
                            },
                            legend: {
                                position: 'bottom'
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        let value = context.raw;
                                        let total = context.dataset.data.reduce((a, b) => a + b, 0);
                                        let percentage = ((value / total) * 100).toFixed(1);

                                        return '$ ' + value.toLocaleString('es-AR', {
                                            minimumFractionDigits: 2
                                        }) + ' (' + percentage + '%)';
                                    }
                                }
                            }
                        }
                    }
                });
            });
        </script>
    </div>
</body>
</html>
