<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://ultraq.net.nz/thymeleaf/layout"
      lang="es"
      layout:decorate="~{fragments/layout}">
<head>
    <title layout:fragment="page-title">Personal Finances App - Dashboard</title>
</head>
<body>
    <div class="container-fluid p-4 overflow-y-auto" layout:fragment="content">
        <h2>Dashboard</h2>
        <form id="bankSyncForm" th:action="@{/bank-sync}" th:object="${bankSyncModelAttribute}" method="post" class="row">
            <input type="hidden" th:field="*{cookie}" id="cookie">
            <input type="hidden" name="accountName" id="accountName">
            <input type="hidden" th:field="*{dateFrom}" id="dateFrom"/>
            <input type="hidden" th:field="*{dateTo}" id="dateTo"/>

            <div class="col-lg-4 col-xl-3 text-center" th:each="account : ${accountsBalances}">
                <i th:if="${#strings.isEmpty(account[3])}" class="bi bi-credit-card fs-1"></i>
                <i th:if="${!#strings.isEmpty(account[3]) and !(account[3].endsWith('.svg') or account[3].endsWith('.png'))}" class="bi me-2" th:with="icon=${account[3]}" th:classappend="${'bi-' + icon}"></i>
                <img th:if="${!#strings.isEmpty(account[3]) and (account[3].endsWith('.svg') or account[3].endsWith('.png'))}" class="me-2" th:src="@{/images/{icon}(icon=${account[3]})}" height="64">
                <h3 class="fw-normal d-none" th:text="${account[0]}">Account name</h3>
                <h2>
                    <span th:text="${#numbers.formatDecimal(account[2], 1, 'POINT', 2, 'COMMA')}"></span>
                    <span th:text="${account[1]}"></span>
                </h2>
                <p><a th:href="@{/expenses(accountName=${account[0]})}" class="btn btn-secondary">Ver detalles</a></p>

                <button type="submit" class="btn btn-success" name="accountName" th:value="${account[0]}"><i class="bi bi-save me-2"></i>Sincronizar</button>
            </div>
        </form>
        <form method="post" enctype="multipart/form-data" th:action="@{/pdf/upload}">
            <input type="file" name="file" accept="application/pdf" />
            <button type="submit">Procesar PDF</button>
        </form>
        <script>
            $(document).ready(function () {
                $('#bankSyncForm').on('submit', async function (e) {
                    e.preventDefault(); // frenamos el submit por defecto

                    const submitter = e.originalEvent.submitter;
                    if (!submitter) {
                        showClipboardErrorToast('No se pudo determinar la cuenta a sincronizar');
                        return;
                    }

                    try {
                        const text = await navigator.clipboard.readText();

                        if (!text || !text.includes('Skywalker=')) {
                            showClipboardErrorToast('El portapapeles no contiene una cookie v&aacute;lida');
                            return;
                        }

                        $('#accountName').val(submitter.value);
                        $('#cookie').val(text);

                        // ahora sí, submit real
                        this.submit();

                    } catch (err) {
                        console.error('No se pudo acceder al portapapeles:', err);
                        showClipboardErrorToast('No se pudo acceder al portapapeles');
                    }
                });
            });
        </script>
    </div>
</body>
</html>
