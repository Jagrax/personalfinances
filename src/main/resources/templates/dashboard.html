<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://ultraq.net.nz/thymeleaf/layout"
      lang="es"
      layout:decorate="~{fragments/layout}">
<head>
    <title layout:fragment="page-title">Personal Finances App - Dashboard</title>
</head>
<body>
    <div class="container-fluid p-4 overflow-y-auto" layout:fragment="content">
        <h2>Dashboard</h2>
        <div class="row">
            <form id="bankSyncForm" th:action="@{/bank-sync}" th:object="${bankSyncModelAttribute}" method="post" class="col-lg-4 col-xl-3 col-xxl text-center" th:each="account : ${accountsBalances}">
                <i th:if="${#strings.isEmpty(account[3])}" class="bi bi-credit-card fs-1"></i>
                <i th:if="${!#strings.isEmpty(account[3]) and !(account[3].endsWith('.svg') or account[3].endsWith('.png'))}" class="bi me-2" th:with="icon=${account[3]}" th:classappend="${'bi-' + icon}"></i>
                <img th:if="${!#strings.isEmpty(account[3]) and (account[3].endsWith('.svg') or account[3].endsWith('.png'))}" class="me-2" th:src="@{/images/{icon}(icon=${account[3]})}" height="64">
                <h3 class="fw-normal d-none" th:text="${account[0]}">Account name</h3>
                <h2>
                    <span th:text="${#numbers.formatDecimal(account[2], 1, 'POINT', 2, 'COMMA')}"></span>
                    <span th:text="${account[1]}"></span>
                </h2>
                <div class="d-flex justify-content-center gap-5">
                    <a th:href="@{/expenses(accountName=${account[0]})}" class="btn btn-secondary" title="Ver detalles"><i class="bi bi-journal-text"></i></a>
                    <div class="input-group" th:if="${'Galicia ARS' == account[0]}">
                        <input type="text" class="form-control" placeholder="ASP.NET_SessionId" aria-label="ASP.NET_SessionId" th:field="*{aspNetSessionId}" required>
                        <button type="submit" class="btn btn-success" name="accountName" th:if="${account[4]}" th:value="${account[0]}" title="Sincronizar con el banco"><i class="bi bi-arrow-repeat"></i></button>
                    </div>
                    <button th:unless="${'Galicia ARS' == account[0]}" type="submit" class="btn btn-success" name="accountName" th:if="${account[4]}" th:value="${account[0]}" title="Sincronizar con el banco"><i class="bi bi-arrow-repeat"></i></button>
                    <button th:if="${'Master Card' == account[0]}" type="button" class="btn btn-outline-danger" title="Procesar PDF" onclick="tiggerPdfUpload()"><i class="bi bi-file-earmark-pdf"></i></button>
                </div>
            </form>
        </div>
        <form id="pdfUploadForm" method="post" enctype="multipart/form-data" th:action="@{/pdf/upload}" class="d-none">
            <input id="pdfFileInput" type="file" name="file" accept="application/pdf" />
        </form>
        <script>
            function tiggerPdfUpload() {
                const input = document.getElementById('pdfFileInput');
                input.click();
                input.onchange = function () {
                    if (input.files.length > 0) {
                        document.getElementById('pdfUploadForm').submit();
                    }
                };
            }
        </script>

    </div>
</body>
</html>
